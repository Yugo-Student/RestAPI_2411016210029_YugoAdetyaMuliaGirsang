services:
  backend:
    build: .
    container_name: ci4-umkm-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend-ci4:/var/www/html
    command: tail -f /dev/null
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ci4-umkm-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_umkm
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ci4-umkm-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  mysql_data: